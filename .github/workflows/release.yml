name: Build and draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Select tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - run: python3 tools/release.py validate "$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev flatpak flatpak-builder librsvg2-bin
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: python tools/release.py package ${{ needs.validate.outputs.tag }} ${{ matrix.target }}
      - name: Package AppImage and Flatpak
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh "${{ needs.validate.outputs.tag }}" "${{ matrix.target }}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python tools/release.py windows-installer ${{ needs.validate.outputs.tag }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.flatpak
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: python3 tools/release.py checksums dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/*.AppImage dist/*.flatpak dist/*-setup.exe dist/SHA256SUMS.txt \
            --verify-tag --draft "${prerelease[@]}" --title "$TAG" \
            --notes-file "release-notes/$TAG.md"
