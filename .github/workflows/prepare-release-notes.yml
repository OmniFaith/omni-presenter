name: Prepare next release notes

on:
  release:
    types: [published]
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-release-notes
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Generate next notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare_release_notes.py
      - name: Commit updated notes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add release-notes/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(release-notes): update upcoming release notes"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
