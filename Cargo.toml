[package]
name = "omni-presenter"
version = "0.8.2-alpha"
edition = "2024"
license = "MIT"

[dependencies]
eframe = "0.37.0"
winit = "0.30.13"
rusqlite = { version = "0.42.0", features = ["bundled"] }
egui-phosphor = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.18.0"
fontdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bytemuck = { version = "1.25.2", features = ["derive"] }
rodio = "0.23.0"
cpal = "0.18.2"
getrandom = "0.4.3"
rcgen = "0.14.10"
libc = "0.2.191"
fontdue = "0.9.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
argon2 = "0.6.0"
mdns-sd = "0.21.7"
rhai = { version = "1.27.0", features = ["sync", "serde"] }
rquickjs = "0.14.0"
resvg = "0.50.0"
naga = { version = "30.0.1", features = ["wgsl-in"] }
ureq = { version = "3.5.2", features = ["json"] }
fluent-bundle = "0.16.0"
fluent-langneg = "0.14.2"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
qrcode = { version = "0.14.1", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
roxmltree = "0.21.2"

[dev-dependencies]

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
tiny_http = { version = "0.12.0", features = ["ssl-openssl"] }
openssl = { version = "0.10.82", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.14.0"

[profile.dev.package."*"]
opt-level = 2
