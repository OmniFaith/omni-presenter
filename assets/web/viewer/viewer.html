<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omni Presenter · Tela virtual</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}body{display:grid;place-items:center}
#stage{position:relative;overflow:hidden;width:100vw;height:100vh}#background,#background video,#shader,#brightness,#dimmer,#text-layers,.slide-layer{position:absolute;inset:0;width:100%;height:100%}
#background video{object-fit:cover}#shader{display:none}#brightness,#dimmer{pointer-events:none}.box{position:absolute;display:flex;overflow:hidden}.lyrics{white-space:pre-wrap;overflow-wrap:anywhere;width:100%;margin:0;paint-order:stroke fill;font-synthesis:none}.paragraph{display:block}
#title{position:absolute;bottom:3%;left:5%;right:5%;text-align:center;font-size:clamp(12px,1.6vw,26px);opacity:.8}
.paragraph.comment{display:inline-block;font-style:italic;font-size:.78em;color:#94a3b8;background:rgba(15,23,42,.7);border-left:3px solid #64748b;padding:2px 10px;border-radius:4px;margin:4px 0;text-shadow:0 1px 3px rgba(0,0,0,.9);font-weight:normal}
#stage-clock{position:fixed;top:18px;left:20px;font:bold clamp(14px,2.2vw,28px) monospace;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.2);color:#38bdf8;padding:6px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.5);letter-spacing:1px;z-index:4}
#next-preview{position:fixed;bottom:18px;right:20px;max-width:45vw;font:500 clamp(12px,1.4vw,20px) sans-serif;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.2);color:#cbd5e1;padding:6px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:4}
#next-preview strong{color:#38bdf8;margin-right:6px;font-weight:700;font-size:.9em}
#fullscreen,#connection,#background-error{position:fixed;border:1px solid #ffffff30;background:#121b2be8;color:white;border-radius:8px;padding:10px 16px;font:13px Arial;z-index:5}
#fullscreen{right:20px;top:20px;cursor:pointer;opacity:0;transition:opacity .18s}body:hover #fullscreen,#fullscreen:focus-visible{opacity:1}#connection,#background-error{bottom:20px;left:50%;transform:translateX(-50%)}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="stage">
  <div id="background"><video id="video" muted playsinline></video><canvas id="shader"></canvas></div>
  <div id="brightness"></div><div id="dimmer"></div>
  <div id="text-layers"><div class="slide-layer" id="current-layer"><div class="box" id="box"><p class="lyrics" id="lyrics"></p></div></div></div>
  <div id="title"></div>
  <div id="stage-clock" hidden>00:00</div>
  <div id="next-preview" hidden></div>
</div>
<button id="fullscreen" type="button">Tela cheia</button>
<div id="connection" role="status">Conectando ao Omni Presenter…</div>
<div id="background-error" hidden></div>
<script src="/viewer.js" defer></script>
</html>
